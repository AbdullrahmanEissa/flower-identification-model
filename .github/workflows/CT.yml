name: CT - Train and Asave The model

on:
  push:
  branches: [master]
  pull_request:
  branches: [master]


jobs:
  matrix-pip:
  name: Train and Save The model
  runs-on: ubuntu-latest
  strategy:
    matrix:
      python: [3.11 , 3.12]

  steps:
    - name: Chekout The Repo
      uses: actions/checkout@v4

    - name: setyp python
      uses: actions/setup-python@v4
      with:
        python-version: ${{matrix.python}}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install Depedencies
      run: python -m pip install -r requirements.txt

    - name: Train The model
      run: |
        python train.py
        ls -la artifacts

    - name: Upload Atifactss (model.pkl) to Github
      uses: actions/upload-artifact@v4
      with:
        name: ml-artifact-${{matrix.python}}-${{github.run_id}}      
